x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  image: tfl-intel-airflow:local
  init: true
  user: "${AIRFLOW_UID:-50000}:0"
  restart: unless-stopped
  networks:
    - backend
  environment: &airflow-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN_CMD: /workspace/scripts/get_airflow_database_url.sh
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_DB: ${POSTGRES_DB:-tfl_intel}
    POSTGRES_USER: ${POSTGRES_USER:-tfl_intel}
    POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    TFL_API_BASE_URL: ${TFL_API_BASE_URL:-https://api.tfl.gov.uk/Line}
    TFL_APP_KEY: ${TFL_APP_KEY:-}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    DUCKDB_PATH: /data/tfl_intel.duckdb
    API_BASE_URL: http://api:8000
    TFL_PYTHON: /opt/tfl-venv/bin/python
  secrets:
    - postgres_password
    - airflow_db_password
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - airflow_logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins:ro
    - ./scripts:/workspace/scripts:ro
    - ./sql:/workspace/sql:ro
    - tfl_intel_duckdb_data:/data

services:
  airflow-db:
    image: postgres:16-bookworm
    init: true
    restart: unless-stopped
    networks:
      - backend
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD_FILE: /run/secrets/airflow_db_password
    secrets:
      - airflow_db_password
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  airflow-init:
    <<: *airflow-common
    restart: "no"
    depends_on:
      airflow-db:
        condition: service_healthy
      postgres:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        airflow db migrate
        airflow users create \
          --username "$${AIRFLOW_ADMIN_USERNAME:-airflow}" \
          --password "$${AIRFLOW_ADMIN_PASSWORD:-airflow}" \
          --firstname "$${AIRFLOW_ADMIN_FIRSTNAME:-Local}" \
          --lastname "$${AIRFLOW_ADMIN_LASTNAME:-Admin}" \
          --role Admin \
          --email "$${AIRFLOW_ADMIN_EMAIL:-airflow@example.com}" || true
    environment:
      <<: *airflow-environment
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-airflow}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-airflow}
      AIRFLOW_ADMIN_FIRSTNAME: ${AIRFLOW_ADMIN_FIRSTNAME:-Local}
      AIRFLOW_ADMIN_LASTNAME: ${AIRFLOW_ADMIN_LASTNAME:-Admin}
      AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-airflow@example.com}

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

secrets:
  airflow_db_password:
    file: ./secrets/airflow_db_password.txt

volumes:
  airflow_db_data:
  airflow_logs:
