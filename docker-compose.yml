services:
  postgres:
    image: postgres:16
    container_name: tfl_intel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tfl_intel
      POSTGRES_USER: tfl_intel
      POSTGRES_PASSWORD: tfl_intel
    ports:
      - "5432:5432"
    volumes:
      - tfl_intel_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tfl_intel -d tfl_intel"]
      interval: 10s
      timeout: 5s
      retries: 5

  duckdb:
    image: duckdb/duckdb:latest
    container_name: tfl_intel_duckdb
    profiles:
      - tools
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /workspace
    volumes:
      - .:/workspace
      - tfl_intel_duckdb_data:/data
    entrypoint: ["duckdb", "/data/tfl_intel.duckdb"]

volumes:
  tfl_intel_postgres_data:
  tfl_intel_duckdb_data: