name: tfl-intel

x-service-defaults: &service-defaults
  init: true
  restart: unless-stopped
  networks:
    - backend

x-postgres-healthcheck: &postgres-healthcheck
  test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 10s

services:
  postgres:
    <<: *service-defaults
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tfl_intel}
      POSTGRES_USER: ${POSTGRES_USER:-tfl_intel}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - tfl_intel_postgres_data:/var/lib/postgresql/data
    healthcheck: *postgres-healthcheck

  duckdb:
    <<: *service-defaults
    image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
    profiles: [tools]
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /workspace
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-tfl_intel}
      POSTGRES_USER: ${POSTGRES_USER:-tfl_intel}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      DUCKDB_PATH: /data/tfl_intel.duckdb
      UV_PROJECT_ENVIRONMENT: /opt/container-venv
    secrets:
      - postgres_password
    volumes:
      - .:/workspace
      - tfl_intel_duckdb_data:/data
    entrypoint: ["uv", "run", "--no-project", "python", "--version"]
    restart: "no"

  api:
    <<: *service-defaults
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: tfl-intel-api:local
    environment:
      DUCKDB_PATH: /data/tfl_intel.duckdb
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - tfl_intel_duckdb_data:/data:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health', timeout=2)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  backend:
    driver: bridge

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt

volumes:
  tfl_intel_postgres_data:
  tfl_intel_duckdb_data:
